<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elementor Style Loading Screen</title>
  <style>
    /* Reset & Base Layout */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121319; /* Dark background */
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Container for the loader elements */
    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    /* Outer Ring with Spinner animation */
    .spinner-ring {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background-color: #2b2e38; /* Circle background */
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Rotating border ring */
    .spinner-ring::before {
      content: "";
      position: absolute;
      top: -4px;
      left: -4px;
      right: -4px;
      bottom: -4px;
      border-radius: 50%;
      border: 4px solid transparent;
      border-top-color: #9b9ea8; /* Rotating arc color */
      animation: spin 1.2s linear infinite;
    }

    /* SVG "E" Logo Container */
    .elementor-icon {
      width: 48px;
      height: 48px;
    }

    /* Individual bars of the "E" logo */
    .bar {
      fill: #ffffff;
      animation: shift-bar 1.8s ease-in-out infinite alternate;
    }

    /* Staggered delay for each bar */
    .bar-top {
      animation-delay: 0s;
    }

    .bar-middle {
      animation-delay: 0.2s;
    }

    .bar-bottom {
      animation-delay: 0.4s;
    }

    /* Loading Text Styling */
    .loading-text {
      color: #9b9ea8;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: pulse 1.5s ease-in-out infinite alternate;
    }

    /* Animations */
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {
      0% {
        opacity: 0.4;
      }
      100% {
        opacity: 1;
      }
    }

    /* Horizontal shifting keyframe for the bars */
    @keyframes shift-bar {
      0% {
        transform: translateX(0);
      }
      50% {
        transform: translateX(3px); /* Subtle shift right */
      }
      100% {
        transform: translateX(-3px); /* Subtle shift left */
      }
    }
  </style>
</head>
<body>

  <div class="loader-container">
    <div class="spinner-ring">
      <svg class="elementor-icon" viewBox="0 0 24 24">
        <rect class="bar bar-top" x="3" y="3" width="18" height="4" rx="0.5" />
        <rect class="bar bar-middle" x="3" y="10" width="11" height="4" rx="0.5" />
        <rect class="bar bar-bottom" x="3" y="17" width="18" height="4" rx="0.5" />
      </svg>
    </div>
    <div class="loading-text">Loading</div>
  </div>

</body>
</html>
