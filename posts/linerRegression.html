<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elementor Style Loading Screen</title>
  <style>
    /* Reset & Base Layout */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121319; /* Dark background */
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    /* Container for the loader elements */
    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* Enlarged Main Circle Container (Border ring removed) */
    .circle-container {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background-color: #2b2e38;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* SVG "E" Logo */
    .elementor-icon {
      width: 64px;
      height: 64px;
    }

    /* Base styling for all logo bars */
    .bar {
      fill: #ffffff;
      animation: fade-sequence 1.6s ease-in-out infinite;
    }

    /* Sequential Staggered Delays for Chain Fading */
    .bar-vertical {
      animation-delay: 0s;
    }

    .bar-top {
      animation-delay: 0.2s;
    }

    .bar-middle {
      animation-delay: 0.4s;
    }

    .bar-bottom {
      animation-delay: 0.6s;
    }

    /* Loading Text Styling */
    .loading-text {
      color: #9b9ea8;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: pulse 1.5s ease-in-out infinite alternate;
    }

    /* Keyframe Animations */
    @keyframes fade-sequence {
      0%, 100% {
        opacity: 0.25;
      }
      30% {
        opacity: 1;
      }
    }

    @keyframes pulse {
      0% {
        opacity: 0.4;
      }
      100% {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <div class="loader-container">
    <div class="circle-container">
      <svg class="elementor-icon" viewBox="0 0 24 24">
        <rect class="bar bar-vertical" x="3" y="3" width="4" height="18" rx="0.5" />
        
        <rect class="bar bar-top" x="9" y="3" width="12" height="4" rx="0.5" />
        <rect class="bar bar-middle" x="9" y="10" width="12" height="4" rx="0.5" />
        <rect class="bar bar-bottom" x="9" y="17" width="12" height="4" rx="0.5" />
      </svg>
    </div>
    <div class="loading-text">Loading</div>
  </div>

</body>
</html>
