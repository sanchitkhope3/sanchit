<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elementor Style Loading Screen</title>
  <style>
    /* Reset & Base Layout */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121319; /* Dark background */
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Top Purple Loading Line Track */
    .top-loading-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px; /* Thin line height */
      background-color: rgba(209, 4, 211, 0.15); /* Translucent track */
      overflow: hidden;
    }

    /* Continuous Solid Purple Line Growing to the Middle */
    .top-loading-bar::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background-color: #D104D3; /* Solid #D104D3 line */
      animation: fill-to-middle 3s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }

    /* Container for the loader elements */
    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    /* Circle Container */
    .circle-container {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background-color: #2b2e38;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* SVG "E" Logo */
    .elementor-icon {
      width: 80px;
      height: 80px;
    }

    /* Base styling for all logo bars */
    .bar {
      fill: #ffffff;
      opacity: 0.15; /* Baseline opacity */
      animation: fade-sequence 2.4s ease-in-out infinite;
    }

    /* Sequential Staggered Delays */
    .bar-vertical {
      animation-delay: 0s;
    }

    .bar-top {
      animation-delay: 0.35s;
    }

    .bar-middle {
      animation-delay: 0.7s;
    }

    .bar-bottom {
      animation-delay: 1.05s;
    }

    /* Loading Text Styling */
    .loading-text {
      color: #9b9ea8;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: pulse 1.8s ease-in-out infinite alternate;
    }

    /* Keyframe Animations */
    
    /* Top Line: Fills from left to 50% width and halts */
    @keyframes fill-to-middle {
      0% {
        width: 0%;
      }
      40% {
        width: 50%; /* Reaches the exact middle */
      }
      85% {
        width: 50%; /* Holds in place at the middle */
        opacity: 1;
      }
      100% {
        width: 50%;
        opacity: 0; /* Smooth reset for looping */
      }
    }

    @keyframes fade-sequence {
      0%, 100% {
        opacity: 0.15;
      }
      35% {
        opacity: 1;
      }
    }

    @keyframes pulse {
      0% {
        opacity: 0.4;
      }
      100% {
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <div class="top-loading-bar"></div>

  <div class="loader-container">
    <div class="circle-container">
      <svg class="elementor-icon" viewBox="0 0 24 24">
        <rect class="bar bar-vertical" x="3" y="3" width="4" height="18" rx="0.5" />
        
        <rect class="bar bar-top" x="9" y="3" width="12" height="4" rx="0.5" />
        <rect class="bar bar-middle" x="9" y="10" width="12" height="4" rx="0.5" />
        <rect class="bar bar-bottom" x="9" y="17" width="12" height="4" rx="0.5" />
      </svg>
    </div>
    <div class="loading-text">Loading</div>
  </div>

</body>
</html>
